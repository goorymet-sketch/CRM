[project]
name = "digital-reach-crm"
version = "0.1.0"
description = "Digital Reach CRM for leads, contacts, and sales follow-ups"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "sqlalchemy>=2.0.0",
  "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
